<!doctype html>
<!-- "noktalar çoğalıyor" — app/animasyon.py doldurur (__VERI__). Dış kaynak yok. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  :root { --zemin: #0E1117; --ada: #1B2433; --kiyi: #7F9BC4; --yazi: #E6EAF0; --soluk: #8A94A6;
          --yesil: #2EA043; --sari: #F0B41E; --kirmizi: #D2322D; }
  html, body { margin: 0; background: var(--zemin); color: var(--yazi);
               font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  .sahne { position: relative; height: 584px; border-radius: 8px; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }
  .ada { fill: var(--ada); }
  .kiyi { fill: none; stroke: var(--kiyi); stroke-width: 1.2; vector-effect: non-scaling-stroke;
          stroke-linejoin: round; }
  circle { transform-box: fill-box; transform-origin: center; transform: scale(0);
           vector-effect: non-scaling-stroke; }
  circle.olculu { stroke: #FFFFFF; stroke-width: 1.6; }
  circle.tahmin { stroke-width: 1.4; fill-opacity: 0.22; }
  circle.pop { animation: pop 0.35s cubic-bezier(.2,.8,.3,1.2) forwards; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .ust { position: absolute; left: 24px; right: 16px; top: 16px; display: flex; gap: 12px 20px;
         flex-wrap: wrap; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .ust > div:first-child { flex: 1 1 320px; }
  .baslik { font-size: 26px; font-weight: 600; text-shadow: 0 1px 6px #000; }
  .sayac { margin-top: 6px; font-size: 16px; color: var(--soluk); }
  .lejant { position: absolute; left: 24px; bottom: 16px; font-size: 13px; color: var(--soluk);
            display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .lejant i { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
              vertical-align: -1px; margin-right: 5px; }
  .etiket { flex: 0 1 280px; font-size: 12px; color: #1B1B1B;
            background: #E9D27A; padding: 5px 9px; border-radius: 4px; }
  button { position: absolute; right: 16px; bottom: 14px; background: #262C38; color: var(--yazi);
           border: 1px solid #3A4252; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
<div class="sahne">
  <svg id="svg" preserveAspectRatio="xMidYMid meet">
    <g id="ada"></g><g id="noktalar"></g>
  </svg>
  <div class="ust">
    <div><div class="baslik" id="baslik"></div><div class="sayac" id="sayac"></div></div>
    <div class="etiket">gösterim — farazi şehir · ada genelindeki noktalar temsilidir, gerçek trafo yeri değil</div>
  </div>
  <div class="lejant">
    <span><i style="background:var(--yesil);box-shadow:0 0 0 1.5px #fff"></i>ölçüldü</span>
    <span><i style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--soluk)"></i>tahmin</span>
    <span><i style="background:var(--yesil)"></i>yer var</span>
    <span><i style="background:var(--sari)"></i>önce ölç</span>
    <span><i style="background:var(--kirmizi)"></i>ölç ya da güçlendir</span>
  </div>
  <button id="tekrar">Baştan oynat</button>
</div>
<script>
const VERI = __VERI__;
const RENK = { yesil: "#2EA043", sari: "#F0B41E", kirmizi: "#D2322D" };
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");

// Görünüm kutuları (km): önce Girne yakın plan, sonra bütün ada.
const girne = VERI.sehirler[0].n;
const gx = girne.map(p => p.x), gy = girne.map(p => p.y);
const ortaX = (Math.min(...gx) + Math.max(...gx)) / 2, ortaY = (Math.min(...gy) + Math.max(...gy)) / 2;
const yakinW = Math.max(Math.max(...gx) - Math.min(...gx), (Math.max(...gy) - Math.min(...gy)) * 1.7) * 1.5;
const YAKIN = [ortaX - yakinW / 2, ortaY - yakinW / 3.4 - yakinW * 0.08, yakinW, yakinW / 1.7];  // noktalar biraz aşağıda: başlığa yer
const ADA = [-4, -2, 228, 132];
const R_PX = { yakin: { o: 7, t: 6 }, ada: { o: 3.4, t: 2.8 } };

function el(ad, oz) { const e = document.createElementNS(NS, ad); for (const k in oz) e.setAttribute(k, oz[k]); return e; }
function yol(h, kapali) { return "M" + h.map(p => p[0] + "," + p[1]).join("L") + (kapali ? "Z" : ""); }

function adaCiz() {
  const g = document.getElementById("ada");
  VERI.dolgu.forEach(h => g.appendChild(el("path", { d: yol(h, true), class: "ada" })));
  VERI.kiyi.forEach(h => g.appendChild(el("path", { d: yol(h, false), class: "kiyi" })));
}

// Zaman çizelgesi (ms): her noktaya bir belirme anı.
function cizelge() {
  const olay = [];
  const g = VERI.sehirler[0].n;
  const olculu = g.filter(p => p.o === 1), tahmin = g.filter(p => p.o !== 1);
  const uzak = p => Math.hypot(p.x - ortaX, p.y - ortaY);
  const sirali = [...olculu].sort((a, b) => a.x - b.x);
  const ilk = sirali[0], ikinci = sirali[sirali.length - 1];
  const ucuncu = olculu.filter(p => p !== ilk && p !== ikinci).sort((a, b) => uzak(a) - uzak(b))[0];
  const kalan = olculu.filter(p => ![ilk, ikinci, ucuncu].includes(p));
  [ilk, ikinci, ucuncu].forEach((p, i) => p && olay.push({ p, t: 900 + i * 1100 }));
  kalan.forEach((p, i) => olay.push({ p, t: 4200 + i * 220 }));
  const yakin = p => Math.min(...olculu.map(q => Math.hypot(p.x - q.x, p.y - q.y)));
  [...tahmin].sort((a, b) => yakin(a) - yakin(b))
    .forEach((p, i) => olay.push({ p, t: 7400 + Math.floor(i / 4) * 170 }));
  const digerleri = VERI.sehirler.slice(1).map(s => ({ s, d: Math.hypot(s.n[0].x - ortaX, s.n[0].y - ortaY) }))
    .sort((a, b) => a.d - b.d);
  digerleri.forEach(({ s }, k) => {
    const bas = 12600 + k * 330;
    s.n.filter(p => p.o === 1).forEach((p, i) => olay.push({ p, t: bas + i * 35 }));
    s.n.filter(p => p.o !== 1).forEach((p, i) => olay.push({ p, t: bas + 300 + Math.floor(i / 6) * 90 }));
  });
  return olay;
}

const ADIMLAR = [
  [0, "Kıb-Tek mahalle trafolarının çoğunu göremiyor"],
  [900, "Bir trafoyu ölçüyoruz"],
  [4200, "Birkaç trafo daha ölçüyoruz"],
  [7400, "Gerisini ölçülenlerden tahmin ediyoruz"],
  [10400, "Aynı yöntem bütün adada"],
];
const ZOOM = [10400, 12400];  // yakın plandan adaya geçiş

let zamanlayicilar = [], kare = null, olaylar = [], sayilar = { o: 0, t: 0 };

function kutu(t) {
  const u = Math.min(1, Math.max(0, (t - ZOOM[0]) / (ZOOM[1] - ZOOM[0])));
  const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  return { v: YAKIN.map((a, i) => a + (ADA[i] - a) * e), e };
}

function yaricapGuncelle(t) {
  const { v, e } = kutu(t);
  svg.setAttribute("viewBox", v.join(" "));
  const olcek = v[2] / svg.getBoundingClientRect().width;
  const rO = (R_PX.yakin.o + (R_PX.ada.o - R_PX.yakin.o) * e) * olcek;
  const rT = (R_PX.yakin.t + (R_PX.ada.t - R_PX.yakin.t) * e) * olcek;
  olaylar.forEach(({ c, o }) => c.setAttribute("r", o ? rO : rT));
}

function sayacYaz() {
  document.getElementById("sayac").textContent =
    `${sayilar.o + sayilar.t} trafo · ${sayilar.o} ölçüldü · ${sayilar.t} tahmin`;
}

function oynat() {
  zamanlayicilar.forEach(clearTimeout); zamanlayicilar = []; cancelAnimationFrame(kare);
  const g = document.getElementById("noktalar"); g.innerHTML = "";
  sayilar = { o: 0, t: 0 }; sayacYaz();
  olaylar = cizelge().map(({ p, t }) => {
    const c = el("circle", { cx: p.x, cy: p.y, r: 0, fill: RENK[p.c] || "#969696",
                             stroke: RENK[p.c] || "#969696", class: p.o === 1 ? "olculu" : "tahmin" });
    g.appendChild(c);
    zamanlayicilar.push(setTimeout(() => { c.classList.add("pop"); sayilar[p.o === 1 ? "o" : "t"]++; sayacYaz(); }, t));
    return { c, o: p.o === 1 };
  });
  const b = document.getElementById("baslik");
  ADIMLAR.forEach(([t, metin]) => zamanlayicilar.push(setTimeout(() => { b.textContent = metin; }, t)));
  baslangic = performance.now();
  const dongu = () => { const t = performance.now() - baslangic; yaricapGuncelle(t);
                        if (t < ZOOM[1] + 200) kare = requestAnimationFrame(dongu); };
  dongu();
}

let baslangic = 0;
addEventListener("resize", () => yaricapGuncelle(performance.now() - baslangic));
adaCiz();
document.getElementById("tekrar").onclick = oynat;
oynat();
</script>
</body>
</html>
